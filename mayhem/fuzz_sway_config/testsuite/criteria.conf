for_window [class="^Firefox$" title="(?i)private"] move container to workspace 3
for_window [app_id="pavucontrol" floating] resize set 800 600
assign [app_id="thunderbird"] workspace 9
no_focus [window_role="pop-up"]
for_window [shell="xwayland"] title_format "%title [X]"
for_window [con_mark="^m\d+$" urgent=latest] focus

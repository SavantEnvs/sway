set $left h
set $ws1 "1: web"
bindsym --to-code --no-repeat Mod1+$left focus left
bindcode 133+24 exec true
bindswitch --locked lid:on output eDP-1 disable
bindgesture swipe:3:right workspace prev
bindsym --inhibited --whole-window button3 kill
mode --pango_markup "<b>launch</b>" {
    bindsym f exec firefox; mode default
}
workspace_layout tabbed
focus_follows_mouse always
mouse_warping container
smart_borders no_gaps
titlebar_padding 4 2
hide_edge_borders --i3 smart
xwayland disable
bar bar-1 {
    id bar-1
    mode hide
    hidden_state show
    modifier Mod4
    tray_output none
    font pango:Sans 9
    separator_symbol " | "
    binding_mode_indicator no
    bindsym button4 workspace prev
    output eDP-1
}
exec_always --no-startup-id swayidle -w

seat seat0 hide_cursor 3000
seat * xcursor_theme Adwaita 24
seat seat0 attach "1:1:AT_Translated_Set_2_keyboard"
input "2:7:SynPS/2_Synaptics_TouchPad" {
    tap enabled
    natural_scroll enabled
    accel_profile flat
    pointer_accel -0.25
    scroll_method two_finger
    events disabled_on_external_mouse
}
input type:touchpad dwt enabled
output eDP-1 mode --custom 1366x768@60.000Hz transform 90 subpixel rgb adaptive_sync on
output "Dell Inc. U2415 7MT0167E0XXL" disable
output * background ~/bg.png fill #112233
